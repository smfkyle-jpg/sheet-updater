name: Daily Kredo sheet sync

on:
  workflow_dispatch: {}
  schedule:
    # 03:07 UTC = ~4:07am UK time while BST (UTC+1) is in effect.
    # GitHub Actions cron is always UTC — once BST ends (late October) this
    # needs bumping to "7 4 * * *" to stay at 4am UK (GMT, UTC+0) local time.
    - cron: "7 3 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run sync
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_B64 }}
